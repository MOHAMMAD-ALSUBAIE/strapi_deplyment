name: CI Build

on: [
  push,pull_request
]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/strapi-deployment:latest
  deploy:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: ssh into server and deploy
        run: |
          mkdir -p ~/.ssh 
          cp ${{ secrets.SSH_KEY }} ~/.ssh/public_ssh_key
          chmod 600 ~/.ssh/public_ssh_key
          ssh -i ~/.ssh/public_ssh_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_PUBLIC_IP }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/strapi-deployment:latest
          docker stop projects-strapi-1 || true
          docker rm projects-strapi-1 || true
          docker run -d --name projects-strapi-1 --network projects_default --env-file /srv/strapi/.env -p 1337:1337 ${{ secrets.DOCKER_USERNAME }}/strapi-deployment:latest
          docker image prune -f
          