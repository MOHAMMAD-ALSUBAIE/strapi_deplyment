services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: f
      DATABASE_SSL: "false"
    volumes:
      # Uploads must outlive the container.
      - strapi-uploads:/app/public/uploads
    ports:
      # Bound to localhost only — nginx on the host proxies to this.
      # Change to "1337:1337" if you want to reach it directly.
      - "127.0.0.1:1337:1337"
    depends_on:
      db:
        condition: service_healthy
 
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: f
    volumes:
      - strapi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 10s
      timeout: 5s
      retries: 5
 
volumes:
  strapi-uploads:
  strapi-db:

